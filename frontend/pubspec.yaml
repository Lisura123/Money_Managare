version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  intl: ^0.19.0
